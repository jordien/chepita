<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Chepita</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        .header {
            background: linear-gradient(135deg, #A63C89 0%, #7B2C64 100%);
            color: white;
            padding: 30px;
            border-radius: 20px 20px 0 0;
        }
        .content { padding: 30px; }
        .info-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            border-left: 4px solid #A63C89;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #A63C89;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #A63C89 0%, #7B2C64 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .message {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        .message.success { background: #d4edda; color: #155724; display: block; }
        .message.error { background: #f8d7da; color: #721c24; display: block; }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Restablecer Contraseña</h1>
            <p>Crea una nueva contraseña para tu cuenta</p>
        </div>
        <div class="content">
            <div id="message" class="message"></div>
            <div id="infoUsuario" class="info-card" style="display: none;">
                <p><strong id="nombreUsuario"></strong></p>
                <p><strong>Correo:</strong> <span id="emailUsuario"></span></p>
            </div>
            <form id="resetForm">
                <input type="password" id="nuevaPassword" placeholder="Nueva contraseña" required>
                <input type="password" id="confirmPassword" placeholder="Confirmar contraseña" required>
                <button type="submit" id="btnSubmit">Restablecer Contraseña</button>
            </form>
            <div style="text-align: center; margin-top: 20px;">
                <a href="/PAG.html" style="color: #A63C89; text-decoration: none;">← Volver al inicio</a>
            </div>
        </div>
    </div>

    <script>
        let token = null;
        let idTrabajador = null;

        function getTokenFromUrl() {
            const params = new URLSearchParams(window.location.search);
            return params.get('token');
        }

        async function verificarToken() {
            token = getTokenFromUrl();
            
            if (!token) {
                mostrarMensaje('No se encontró un token válido. El enlace puede estar roto.', 'error');
                document.getElementById('btnSubmit').disabled = true;
                return;
            }

            try {
                const response = await fetch(`/api/trabajadores/verificar-token-recuperacion/${token}`);
                const data = await response.json();

                if (!data.valido) {
                    mostrarMensaje(data.message || 'El enlace ha expirado o ya fue usado. Solicita uno nuevo.', 'error');
                    document.getElementById('btnSubmit').disabled = true;
                    return;
                }

                idTrabajador = data.id_trabajador;
                document.getElementById('infoUsuario').style.display = 'block';
                document.getElementById('nombreUsuario').textContent = data.nombre;
                document.getElementById('emailUsuario').textContent = data.email;
                
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error al verificar el enlace. Intenta de nuevo.', 'error');
                document.getElementById('btnSubmit').disabled = true;
            }
        }

        function mostrarMensaje(mensaje, tipo) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = mensaje;
            messageDiv.className = `message ${tipo}`;
            setTimeout(() => {
                messageDiv.style.display = 'none';
                messageDiv.className = 'message';
            }, 5000);
        }

        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nuevaPassword = document.getElementById('nuevaPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (nuevaPassword !== confirmPassword) {
                mostrarMensaje('Las contraseñas no coinciden', 'error');
                return;
            }
            if (nuevaPassword.length < 4) {
                mostrarMensaje('La contraseña debe tener al menos 4 caracteres', 'error');
                return;
            }
            
            const btn = document.getElementById('btnSubmit');
            btn.innerHTML = '<span class="loading"></span> Procesando...';
            btn.disabled = true;
            
            try {
                const response = await fetch('/api/trabajadores/restablecer-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, nueva_password: nuevaPassword })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    mostrarMensaje('✅ ' + data.message, 'success');
                    setTimeout(() => {
                        window.location.href = '/PAG.html';
                    }, 3000);
                } else {
                    mostrarMensaje(data.message || 'Error al restablecer la contraseña', 'error');
                    btn.innerHTML = 'Restablecer Contraseña';
                    btn.disabled = false;
                }
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('Error de conexión con el servidor', 'error');
                btn.innerHTML = 'Restablecer Contraseña';
                btn.disabled = false;
            }
        });

        verificarToken();
    </script>
</body>
</html>
