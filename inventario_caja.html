<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Cache-Control"
      content="no-cache, no-store, must-revalidate"
    />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Inventario - Caja</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="inventario_caja.css" />
    <style>
      /* Estilos de paginación */
      .paginacion-container {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 8px;
        margin-top: 20px;
        padding: 10px;
        flex-wrap: wrap;
      }
      .btn-paginacion {
        padding: 8px 14px;
        border: none;
        border-radius: 8px;
        background: #f0f0f0;
        color: #333;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 14px;
      }
      .btn-paginacion:hover {
        background: #e0e0e0;
        transform: scale(1.02);
      }
      .btn-paginacion.active {
        background: linear-gradient(135deg, #A63C89, #4a1d6d);
        color: white;
      }
      .btn-paginacion:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
      }
      .paginacion-puntos {
        color: #999;
        font-size: 16px;
        padding: 0 4px;
      }
    </style>
  </head>
  <body>
    <div class="header-marcas">
      <div class="header-marcas-scroll">
        <div class="header-track">
          <img src="imagenes/marcas/logo1.png" />
          <img src="imagenes/marcas/logo2.png" />
          <img src="imagenes/marcas/logo3.png" />
          <img src="imagenes/marcas/logo4.png" />
          <img src="imagenes/marcas/logo5.png" />
          <img src="imagenes/marcas/logo6.png" />

          <img src="imagenes/marcas/logo1.png" />
          <img src="imagenes/marcas/logo2.png" />
          <img src="imagenes/marcas/logo3.png" />
          <img src="imagenes/marcas/logo4.png" />
          <img src="imagenes/marcas/logo5.png" />
          <img src="imagenes/marcas/logo6.png" />
        </div>
      </div>
    </div>

    <div class="container">
      <div class="top-nav">
        <h2>📦 Inventario - Caja</h2>
        <button class="btn-volver-top" onclick="volverMenuCaja()">
          🏠 Volver a Caja
        </button>
      </div>

      <div class="filtros">
        <input
          type="text"
          id="searchInput"
          placeholder="🔍 Buscar por nombre o marca..."
          onkeyup="filtrarTabla()"
        />
        <select id="categoriaFilter" onchange="filtrarTabla()">
          <option value="">Todas las categorías</option>
        </select>
        <select id="estadoFilter" onchange="filtrarTabla()">
          <option value="">Todos los estados</option>
          <option value="Disponible">Disponible</option>
          <option value="Agotado">Agotado</option>
          <option value="Descontinuado">Descontinuado</option>
        </select>
        <select id="proveedorFilter" onchange="filtrarTabla()">
          <option value="">Todos los proveedores</option>
        </select>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Producto</th>
              <th>Marca</th>
              <th>Categoría</th>
              <th>Precio Venta</th>
              <th>Stock</th>
              <th>Proveedor</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="cuerpoTabla">
            <tr>
              <td colspan="7" class="loading">Cargando inventario...</td>
            </tr>
          </tbody>
        </table>
        <div id="paginacionControles" class="paginacion-container"></div>
      </div>
    </div>

    <script>
      // ========== PROTECCIÓN DE NAVEGACIÓN ==========
      (function bloquearBotonAtras() {
        const paginaMenuCaja = "menu_caja.html";
        const paginaLogin = "PAG.html";

        const token = localStorage.getItem("token");
        const trabajadorStr = localStorage.getItem("trabajador");

        if (
          !token ||
          !trabajadorStr ||
          trabajadorStr === "null" ||
          trabajadorStr === "undefined"
        ) {
          window.location.replace(paginaLogin);
          return;
        }

        fetch("/api/verificar-sesion-trabajador", {
          method: "GET",
          headers: {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json",
          },
        })
          .then((response) => response.json())
          .then((data) => {
            if (!data.autenticado) {
              localStorage.clear();
              sessionStorage.clear();
              window.location.replace(paginaLogin);
            }
          })
          .catch((error) => {
            console.error("Error verificando sesión:", error);
            window.location.replace(paginaLogin);
          });

        for (let i = 0; i < 100; i++) {
          history.pushState(null, null, location.href);
        }

        window.addEventListener("popstate", function () {
          if (
            !localStorage.getItem("token") ||
            !localStorage.getItem("trabajador")
          ) {
            window.location.replace(paginaLogin);
            return;
          }
          history.go(1);
          setTimeout(() => {
            history.pushState(null, null, location.href);
          }, 10);
        });
      })();

      function volverMenuCaja() {
        window.location.replace("menu_caja.html");
      }

      let inventarioData = [];
      let productosCompletos = [];
      let categoriasLista = [];
      let proveedoresLista = [];

      // ========== VARIABLES DE PAGINACIÓN ==========
      let paginaActualInventario = 1;
      let totalPaginasInventario = 1;
      const ITEMS_POR_PAGINA = 50;

      // ========== CARGA DE INVENTARIO OPTIMIZADA ==========
      async function cargarInventario() {
        const tbody = document.getElementById("cuerpoTabla");
        tbody.innerHTML =
          '<tr><td colspan="7" class="loading">Cargando inventario...</td></tr>';

        try {
          // Cargar productos (YA INCLUYE PROVEEDOR)
          const resProd = await fetch("/api/productos");
          if (!resProd.ok) throw new Error("Error al cargar productos");
          let productos = await resProd.json();

          // Cargar categorías y proveedores en paralelo
          const [categoriasRes, proveedoresRes] = await Promise.all([
            fetch("/api/categorias"),
            fetch("/api/proveedores"),
          ]);

          if (categoriasRes.ok) {
            categoriasLista = await categoriasRes.json();
            actualizarSelectCategorias();
          }
          if (proveedoresRes.ok) {
            proveedoresLista = await proveedoresRes.json();
          }

          // Normalizar estados y asegurar stock
          productos = productos.map((p) => {
            p.Stock = p.Stock !== undefined && p.Stock !== null ? p.Stock : 0;
            // Normalizar estado
            if (
              !p.Nombre_Estado ||
              p.Nombre_Estado === "Disponible1" ||
              p.Nombre_Estado === "Disponible2"
            ) {
              if (p.Stock === 0) {
                p.Nombre_Estado = "Agotado";
              } else if (p.Stock > 0) {
                p.Nombre_Estado = "Disponible";
              } else {
                p.Nombre_Estado = p.Nombre_Estado || "Disponible";
              }
            }
            // Asegurar que proveedor tenga un valor
            p.Proveedor = p.Proveedor || "Sin asignar";
            return p;
          });

          productosCompletos = productos;
          totalPaginasInventario = Math.ceil(productos.length / ITEMS_POR_PAGINA);
          paginaActualInventario = 1;
          actualizarFiltroProveedores();
          mostrarPaginaInventario();
        } catch (error) {
          console.error("Error:", error);
          tbody.innerHTML =
            '<tr><td colspan="7" class="loading">❌ Error al cargar los datos. Verifica que el servidor esté corriendo.</td></tr>';
        }
      }

      function actualizarSelectCategorias() {
        const filterSelect = document.getElementById("categoriaFilter");
        const valorActual = filterSelect.value;

        filterSelect.innerHTML =
          '<option value="">Todas las categorías</option>';

        categoriasLista.forEach((c) => {
          if (c.Nombre) {
            const opt = new Option(c.Nombre, c.Nombre);
            filterSelect.add(opt);
          }
        });

        if (
          valorActual &&
          categoriasLista.some((c) => c.Nombre === valorActual)
        ) {
          filterSelect.value = valorActual;
        }
      }

      function actualizarFiltroProveedores() {
        const filterSelect = document.getElementById("proveedorFilter");
        const proveedoresUnicos = [
          ...new Set(
            productosCompletos
              .map((p) => p.Proveedor)
              .filter((p) => p && p !== "Sin asignar"),
          ),
        ];

        filterSelect.innerHTML =
          '<option value="">Todos los proveedores</option>';

        proveedoresUnicos.forEach((prov) => {
          const opt = new Option(prov, prov);
          filterSelect.add(opt);
        });
      }

      function escapeHtml(str) {
        if (!str) return "";
        return str.replace(/[&<>]/g, function (m) {
          if (m === "&") return "&amp;";
          if (m === "<") return "&lt;";
          if (m === ">") return "&gt;";
          return m;
        });
      }

      // ========== FUNCIONES DE PAGINACIÓN ==========
      function mostrarPaginaInventario() {
        const inicio = (paginaActualInventario - 1) * ITEMS_POR_PAGINA;
        const fin = inicio + ITEMS_POR_PAGINA;
        inventarioData = productosCompletos.slice(inicio, fin);
        mostrarTabla();
        actualizarControlesPaginacion();
      }

      function cambiarPaginaInventario(pagina) {
        if (pagina < 1 || pagina > totalPaginasInventario) return;
        paginaActualInventario = pagina;
        mostrarPaginaInventario();
        // Scroll al inicio de la tabla
        document.querySelector(".table-container").scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function actualizarControlesPaginacion() {
        const paginacionDiv = document.getElementById("paginacionControles");
        if (!paginacionDiv) return;

        if (totalPaginasInventario <= 1) {
          paginacionDiv.style.display = "none";
          return;
        }

        paginacionDiv.style.display = "flex";

        let html = "";

        html += `<button class="btn-paginacion" onclick="cambiarPaginaInventario(${paginaActualInventario - 1})" ${paginaActualInventario === 1 ? 'disabled' : ''}>« Anterior</button>`;

        let inicio = Math.max(1, paginaActualInventario - 2);
        let fin = Math.min(totalPaginasInventario, paginaActualInventario + 2);

        if (inicio > 1) {
          html += `<button class="btn-paginacion" onclick="cambiarPaginaInventario(1)">1</button>`;
          if (inicio > 2) html += `<span class="paginacion-puntos">...</span>`;
        }

        for (let i = inicio; i <= fin; i++) {
          html += `<button class="btn-paginacion ${i === paginaActualInventario ? "active" : ""}" onclick="cambiarPaginaInventario(${i})">${i}</button>`;
        }

        if (fin < totalPaginasInventario) {
          if (fin < totalPaginasInventario - 1)
            html += `<span class="paginacion-puntos">...</span>`;
          html += `<button class="btn-paginacion" onclick="cambiarPaginaInventario(${totalPaginasInventario})">${totalPaginasInventario}</button>`;
        }

        html += `<button class="btn-paginacion" onclick="cambiarPaginaInventario(${paginaActualInventario + 1})" ${paginaActualInventario === totalPaginasInventario ? 'disabled' : ''}>Siguiente »</button>`;

        html += `<span style="margin-left: 15px; color: #666; font-size: 13px;">Página ${paginaActualInventario} de ${totalPaginasInventario}</span>`;

        paginacionDiv.innerHTML = html;
      }

      // ========== MOSTRAR TABLA ==========
      function mostrarTabla() {
        const tbody = document.getElementById("cuerpoTabla");

        if (inventarioData.length === 0) {
          tbody.innerHTML =
            '<tr><td colspan="7" class="loading">📭 No hay productos que coincidan con los filtros</td></tr>';
          return;
        }

        tbody.innerHTML = inventarioData
          .map((p) => {
            let stockClass = "";
            let stockText = `${p.Stock} unidades`;
            if (p.Stock === 0) {
              stockClass = "stock-cero";
              stockText = "Agotado";
            } else if (p.Stock <= 5) {
              stockClass = "stock-bajo";
            } else {
              stockClass = "stock-normal";
            }

            let estadoClass = "";
            if (p.Nombre_Estado === "Disponible")
              estadoClass = "status-Disponible";
            else if (p.Nombre_Estado === "Agotado")
              estadoClass = "status-Agotado";
            else if (p.Nombre_Estado === "Descontinuado")
              estadoClass = "status-Descontinuado";

            return `
            <tr>
                <td><strong>${escapeHtml(p.Nombre)}</strong></td>
                <td>${escapeHtml(p.Marca || "N/A")}</td>
                <td>${escapeHtml(p.Nombre_Categoria || "Sin categoría")}</td>
                <td>C$ ${parseFloat(p.Precio).toFixed(2)}</td>
                <td class="${stockClass}">${stockText}</td>
                <td>${escapeHtml(p.Proveedor)}</td>
                <td><span class="status-badge ${estadoClass}">${p.Nombre_Estado || "Disponible"}</span></td>
            </tr>
        `;
          })
          .join("");
      }

      // ========== FILTRAR TABLA ==========
      function filtrarTabla() {
        const search = document
          .getElementById("searchInput")
          .value.toLowerCase()
          .trim();
        const catF = document.getElementById("categoriaFilter").value;
        const estF = document.getElementById("estadoFilter").value;
        const provF = document.getElementById("proveedorFilter").value;

        let filtrados = productosCompletos.filter((p) => {
          const matchTxt =
            (p.Nombre && p.Nombre.toLowerCase().includes(search)) ||
            (p.Marca && p.Marca.toLowerCase().includes(search));
          const matchCat = !catF || p.Nombre_Categoria === catF;
          const matchEst = !estF || p.Nombre_Estado === estF;
          const matchProv = !provF || p.Proveedor === provF;
          return matchTxt && matchCat && matchEst && matchProv;
        });

        // Ordenar: primero los que tienen stock > 0, luego los agotados
        filtrados.sort((a, b) => {
          if (a.Stock > 0 && b.Stock === 0) return -1;
          if (a.Stock === 0 && b.Stock > 0) return 1;
          return 0;
        });

        productosCompletos = filtrados;
        totalPaginasInventario = Math.ceil(filtrados.length / ITEMS_POR_PAGINA);
        paginaActualInventario = 1;
        mostrarPaginaInventario();
      }

      window.onload = () => {
        cargarInventario();
      };
    </script>
  </body>
</html>
