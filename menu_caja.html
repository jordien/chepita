<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Caja - Tienda Chepita</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="menu_caja.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<header class="top-bar">
    <div class="brands-container">
        <div class="brands-track">
            <img src="imagenes/marcas/logo1.png">
            <img src="imagenes/marcas/logo2.png">
            <img src="imagenes/marcas/logo3.png">
            <img src="imagenes/marcas/logo4.png">

            <img src="imagenes/marcas/logo1.png">
            <img src="imagenes/marcas/logo2.png">
            <img src="imagenes/marcas/logo3.png">
            <img src="imagenes/marcas/logo4.png">
        </div>
    </div>

    <div class="clock-box" id="currentDate"></div>
</header>
<div class="admin-container">

    <!-- HEADER -->
    <div class="admin-header">
        <div class="admin-badge">
            <i class="fas fa-cash-register"></i>
            <span>Cajero</span>
        </div>
        <div class="header-date" id="currentDate"></div>
    </div>

    <!-- TÍTULO -->
    <div class="main-title">
        <h1>TIENDA CHEPITA</h1>
        <p class="subtitle">Panel de Caja</p>
    </div>

    <!-- INFO CAJERO -->
    <div class="welcome-card">
        <div class="welcome-icon">
            <i class="fas fa-user"></i>
        </div>
        <div class="welcome-text">
            <h3 id="nombreCajero">Cargando...</h3>
            <p>Seleccione una opción para continuar</p>
        </div>
    </div>

    <!-- SOLO 2 OPCIONES -->
    <div class="modules-grid">

        <div class="module-card" onclick="iniciarVenta()">
            <div class="module-icon">
                <i class="fas fa-shopping-cart"></i>
            </div>
            <div class="module-info">
                <h3>Nueva Venta</h3>
                <p>Registrar una venta</p>
            </div>
            <div class="module-arrow">
                <i class="fas fa-arrow-right"></i>
            </div>
        </div>

        <div class="module-card" onclick="consultarInventario()">
            <div class="module-icon">
                <i class="fas fa-box"></i>
            </div>
            <div class="module-info">
                <h3>Consultar Inventario</h3>
                <p>Ver productos disponibles</p>
            </div>
            <div class="module-arrow">
                <i class="fas fa-arrow-right"></i>
            </div>
        </div>

    </div>

    <!-- BOTÓN -->
    <div class="logout-section">
        <button class="btn-logout" onclick="mostrarModalCerrarJornada()">
            <i class="fas fa-sign-out-alt"></i>
            <span>Cerrar Jornada / Salir</span>
        </button>
    </div>

    <!-- FOOTER -->
    <div class="admin-footer">
        <p><i class="fas fa-database"></i> Sistema de Gestión Comercial - v2.0</p>
        <p><i class="fas fa-copyright"></i> 2025 Tienda Chepita</p>
    </div>

</div>

    <!-- Modal de mensajes --> 
    <div id="modalMensaje" class="modal-mensaje"> 
        <div class="modal-contenido"> 
            <h3 id="modalTitulo"></h3> 
            <p id="modalTexto"></p> 
            <div class="modal-buttons" id="modalBotones"> 
                <button class="modal-btn" onclick="cerrarModal()">Aceptar</button> 
            </div> 
        </div> 
    </div>

    <script>
        // ========== VERIFICACIÓN DE SESIÓN AL CARGAR (igual que admin) ==========
        (function verificarSesionAlInicio() {
            const cajeroActual = sessionStorage.getItem('cajeroActual');
            
            // Si no hay sesión de cajero, redirigir al login
            if (!cajeroActual || cajeroActual === 'null' || cajeroActual === '') {
                sessionStorage.clear();
                window.location.replace('PAG.html');
                return;
            }
        })();

        // ========== BLOQUEAR BOTÓN ATRÁS DEL NAVEGADOR (IGUAL QUE ADMIN) ==========
        (function bloquearBotonAtras() {
            // Agregar un estado al historial
            history.pushState(null, null, location.href);
            
            // Escuchar el evento de popstate (cuando presionan ← o →)
            window.addEventListener('popstate', function() {
                // Volver a empujar el estado actual
                history.pushState(null, null, location.href);
                // Redirigir al mismo menú (evita que salga)
                window.location.replace('menu_caja.html');
            });
        })();

        function mostrarModal(titulo, texto, tipo) {
            const modal = document.getElementById('modalMensaje');
            const tituloElem = document.getElementById('modalTitulo');
            const textoElem = document.getElementById('modalTexto');
            const botonesDiv = document.getElementById('modalBotones');
            
            tituloElem.textContent = titulo;
            tituloElem.className = tipo === 'exito' ? 'exito' : (tipo === 'advertencia' ? 'advertencia' : 'error');
            textoElem.textContent = texto;
            
            botonesDiv.innerHTML = '<button class="modal-btn" onclick="cerrarModal()">Aceptar</button>';
            
            modal.style.display = 'flex';
        }
        
        function mostrarModalConfirmacion(titulo, texto, accionSi) {
            const modal = document.getElementById('modalMensaje');
            const tituloElem = document.getElementById('modalTitulo');
            const textoElem = document.getElementById('modalTexto');
            const botonesDiv = document.getElementById('modalBotones');
            
            tituloElem.textContent = titulo;
            tituloElem.className = 'advertencia';
            textoElem.textContent = texto;
            
            botonesDiv.innerHTML = `
                <button class="modal-btn" id="btnConfirmarSi">Aceptar</button>
                <button class="modal-btn cancelar" id="btnConfirmarNo">Cancelar</button>
            `;
            
            document.getElementById('btnConfirmarSi').onclick = function() {
                cerrarModal();
                if (accionSi) accionSi();
            };
            document.getElementById('btnConfirmarNo').onclick = function() {
                cerrarModal();
            };
            
            modal.style.display = 'flex';
        }
        
        function cerrarModal() {
            document.getElementById('modalMensaje').style.display = 'none';
        }
        
        function cargarInfoCajero() {
            const nombre = sessionStorage.getItem('cajeroActual');
            
            if (nombre && nombre !== 'null' && nombre !== 'undefined' && nombre !== '') {
                document.getElementById('nombreCajero').textContent = nombre;
            } else {
                document.getElementById('nombreCajero').textContent = 'Sesión no iniciada';
                mostrarModal('Sesión no iniciada', 'Por favor, inicie sesión nuevamente.', 'error');
                setTimeout(function() {
                    window.location.replace('PAG.html');
                }, 2000);
            }
        }
        
        function iniciarVenta() {
            const nombre = sessionStorage.getItem('cajeroActual');
            if (!nombre || nombre === 'null' || nombre === '') {
                mostrarModal('Sesión no iniciada', 'Por favor, inicie sesión para realizar una venta.', 'error');
                setTimeout(function() {
                    window.location.replace('PAG.html');
                }, 2000);
                return;
            }
            window.location.href = 'nueva_compra.html';
        }
        
        function consultarInventario() {
            window.location.href = 'inventario_caja.html';
        }
        
        function mostrarModalCerrarJornada() {
            mostrarModalConfirmacion('Cerrar Jornada', '¿Está seguro que desea cerrar la jornada? Se cerrará su sesión.', function() {
                sessionStorage.clear();
                window.location.replace('PAG.html');
            });
        }
        
        function mostrarFecha() {
            const fecha = new Date();
            const options = { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric',
                weekday: 'long'
            };
            const fechaFormateada = fecha.toLocaleDateString('es-ES', options);
            const dateElement = document.getElementById('currentDate');
            if (dateElement) {
                dateElement.innerHTML = `<i class="fas fa-calendar-alt"></i> ${fechaFormateada}`;
            }
        }
        
        window.onload = function() {
            cargarInfoCajero();
            mostrarFecha();
        };
        
        window.onclick = function(event) {
            const modal = document.getElementById('modalMensaje');
            if (event.target === modal) {
                cerrarModal();
            }
        };
    </script>
</body>
</html>
