<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Caja - Tienda Chepita</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="menu_caja.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .modal-mensaje {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(6px);
        }
        .modal-contenido {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .modal-btn {
            background: linear-gradient(135deg, #e7b6d4, #caa0d8);
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 40px;
            cursor: pointer;
            margin: 5px;
        }
        .modal-btn.cancelar {
            background: #f3e8ff;
            color: #b57acb;
        }
        .loading-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255,255,255,0.95);
            justify-content: center;
            align-items: center;
            z-index: 2000;
            flex-direction: column;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3e8ff;
            border-top: 5px solid #caa0d8;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <p style="margin-top: 15px; color: #caa0d8;">Cargando...</p>
</div>

<header class="top-bar">
    <div class="brands-container">
        <div class="brands-track">
            <img src="imagenes/marcas/logo1.png">
            <img src="imagenes/marcas/logo2.png">
            <img src="imagenes/marcas/logo3.png">
            <img src="imagenes/marcas/logo4.png">
            <img src="imagenes/marcas/logo1.png">
            <img src="imagenes/marcas/logo2.png">
            <img src="imagenes/marcas/logo3.png">
            <img src="imagenes/marcas/logo4.png">
        </div>
    </div>
    <div class="clock-box" id="currentDate"></div>
</header>
<div class="admin-container">

    <div class="admin-header">
        <div class="admin-badge">
            <i class="fas fa-cash-register"></i>
            <span>Cajero</span>
        </div>
        <div class="header-date" id="headerDate"></div>
    </div>

    <div class="main-title">
        <h1>TIENDA CHEPITA</h1>
        <p class="subtitle">Panel de Caja</p>
    </div>

    <div class="welcome-card">
        <div class="welcome-icon">
            <i class="fas fa-user"></i>
        </div>
        <div class="welcome-text">
            <h3 id="nombreCajero">Cargando...</h3>
            <p id="infoUsuario">Seleccione una opción para continuar</p>
        </div>
    </div>

    <div class="modules-grid">
        <div class="module-card" onclick="iniciarVenta()">
            <div class="module-icon">
                <i class="fas fa-shopping-cart"></i>
            </div>
            <div class="module-info">
                <h3>Nueva Venta</h3>
                <p>Registrar una venta</p>
            </div>
            <div class="module-arrow">
                <i class="fas fa-arrow-right"></i>
            </div>
        </div>

        <div class="module-card" onclick="consultarInventario()">
            <div class="module-icon">
                <i class="fas fa-box"></i>
            </div>
            <div class="module-info">
                <h3>Consultar Inventario</h3>
                <p>Ver productos disponibles</p>
            </div>
            <div class="module-arrow">
                <i class="fas fa-arrow-right"></i>
            </div>
        </div>
    </div>

    <div class="logout-section">
        <button class="btn-logout" onclick="mostrarModalCerrarJornada()">
            <i class="fas fa-sign-out-alt"></i>
            <span>Cerrar Jornada / Salir</span>
        </button>
    </div>

    <div class="admin-footer">
        <p><i class="fas fa-database"></i> Sistema de Gestión Comercial - v2.0</p>
        <p><i class="fas fa-copyright"></i> 2025 Tienda Chepita</p>
    </div>
</div>

<div id="modalMensaje" class="modal-mensaje"> 
    <div class="modal-contenido"> 
        <h3 id="modalTitulo"></h3> 
        <p id="modalTexto"></p> 
        <div class="modal-buttons" id="modalBotones"> 
            <button class="modal-btn" onclick="cerrarModal()">Aceptar</button> 
        </div> 
    </div> 
</div>

<script>
    function mostrarLoading() {
        const overlay = document.getElementById('loadingOverlay');
        if (overlay) overlay.style.display = 'flex';
    }
    
    function ocultarLoading() {
        const overlay = document.getElementById('loadingOverlay');
        if (overlay) overlay.style.display = 'none';
    }
    
    // ========== VERIFICACIÓN DE SESIÓN ==========
    (function verificarSesionAlInicio() {
        const token = localStorage.getItem('token');
        const trabajadorStr = localStorage.getItem('trabajador');
        
        if (!token || !trabajadorStr || trabajadorStr === 'null' || trabajadorStr === 'undefined') {
            localStorage.clear();
            sessionStorage.clear();
            window.location.replace('PAG.html');
            return;
        }
        
        fetch('/api/verificar-sesion-trabajador', {
            method: 'GET',
            headers: {
                'Authorization': `Bearer ${token}`,
                'Content-Type': 'application/json'
            }
        })
        .then(response => response.json())
        .then(data => {
            if (!data.autenticado) {
                localStorage.clear();
                sessionStorage.clear();
                window.location.replace('PAG.html');
            } else {
                ocultarLoading();
            }
        })
        .catch(error => {
            console.error('Error verificando sesión:', error);
            localStorage.clear();
            sessionStorage.clear();
            window.location.replace('PAG.html');
        });
    })();

    // ========== BLOQUEAR BOTÓN ATRÁS - QUE NO SALGA DE MENU CAJA ==========
    (function bloquearBotonAtras() {
        // Esta es la solución más simple y efectiva
        // Cada vez que se intenta ir atrás, se añade un nuevo estado hacia adelante
        
        // Crear un montón de estados falsos en el historial
        for (let i = 0; i < 100; i++) {
            history.pushState(null, null, location.href);
        }
        
        // Escuchar el evento de ir atrás
        window.addEventListener('popstate', function() {
            // Verificar sesión
            if (!localStorage.getItem('token') || !localStorage.getItem('trabajador')) {
                window.location.replace('PAG.html');
                return;
            }
            
            // En lugar de dejar que el navegador vaya atrás,
            // forzamos un nuevo estado hacia adelante
            // Esto hace que el botón "atrás" no haga nada visible
            history.go(1);
            
            // También agregamos un nuevo estado para mantener el buffer
            setTimeout(() => {
                history.pushState(null, null, location.href);
            }, 10);
        });
    })();

    function mostrarModal(titulo, texto, tipo) {
        const modal = document.getElementById('modalMensaje');
        const tituloElem = document.getElementById('modalTitulo');
        const textoElem = document.getElementById('modalTexto');
        const botonesDiv = document.getElementById('modalBotones');
        
        tituloElem.textContent = titulo;
        textoElem.textContent = texto;
        botonesDiv.innerHTML = '<button class="modal-btn" onclick="cerrarModal()">Aceptar</button>';
        modal.style.display = 'flex';
    }
    
    function mostrarModalConfirmacion(titulo, texto, accionSi) {
        const modal = document.getElementById('modalMensaje');
        const tituloElem = document.getElementById('modalTitulo');
        const textoElem = document.getElementById('modalTexto');
        const botonesDiv = document.getElementById('modalBotones');
        
        tituloElem.textContent = titulo;
        textoElem.textContent = texto;
        
        botonesDiv.innerHTML = `
            <button class="modal-btn" id="btnConfirmarSi">Sí, continuar</button>
            <button class="modal-btn cancelar" id="btnConfirmarNo">Cancelar</button>
        `;
        
        document.getElementById('btnConfirmarSi').onclick = function() {
            cerrarModal();
            if (accionSi) accionSi();
        };
        document.getElementById('btnConfirmarNo').onclick = function() {
            cerrarModal();
        };
        
        modal.style.display = 'flex';
    }
    
    function cerrarModal() {
        document.getElementById('modalMensaje').style.display = 'none';
    }
    
    function cargarInfoCajero() {
        const trabajadorStr = localStorage.getItem('trabajador');
        
        if (trabajadorStr && trabajadorStr !== 'null' && trabajadorStr !== 'undefined') {
            try {
                const trabajador = JSON.parse(trabajadorStr);
                document.getElementById('nombreCajero').textContent = trabajador.nombre || 'Trabajador';
                document.getElementById('infoUsuario').innerHTML = `<i class="fas fa-user-circle"></i> Bienvenido/a`;
            } catch (e) {
                console.error('Error parseando trabajador:', e);
                document.getElementById('nombreCajero').textContent = 'Error al cargar datos';
                setTimeout(function() {
                    window.location.replace('PAG.html');
                }, 2000);
            }
        } else {
            document.getElementById('nombreCajero').textContent = 'Sesión no iniciada';
            mostrarModal('Sesión no iniciada', 'Por favor, inicie sesión nuevamente.', 'error');
            setTimeout(function() {
                window.location.replace('PAG.html');
            }, 2000);
        }
    }
    
    function iniciarVenta() {
        const token = localStorage.getItem('token');
        const trabajadorStr = localStorage.getItem('trabajador');
        
        if (!token || !trabajadorStr) {
            mostrarModal('Sesión no iniciada', 'Por favor, inicie sesión para realizar una venta.', 'error');
            setTimeout(function() {
                window.location.replace('PAG.html');
            }, 2000);
            return;
        }
        
        mostrarLoading();
        window.location.replace('nueva_compra.html');
    }
    
    function consultarInventario() {
        mostrarLoading();
        window.location.replace('inventario_caja.html');
    }
    
    function mostrarModalCerrarJornada() {
        mostrarModalConfirmacion('Cerrar Jornada', '¿Está seguro que desea cerrar la jornada? Se cerrará su sesión.', function() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.replace('PAG.html');
        });
    }
    
    function mostrarFecha() {
        const fecha = new Date();
        const options = { 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric',
            weekday: 'long'
        };
        const fechaFormateada = fecha.toLocaleDateString('es-ES', options);
        const dateElements = document.querySelectorAll('#currentDate, #headerDate');
        dateElements.forEach(element => {
            if (element) {
                element.innerHTML = `<i class="fas fa-calendar-alt"></i> ${fechaFormateada}`;
            }
        });
    }
    
    window.onload = function() {
        cargarInfoCajero();
        mostrarFecha();
        ocultarLoading();
    };
    
    window.onclick = function(event) {
        const modal = document.getElementById('modalMensaje');
        if (event.target === modal) {
            cerrarModal();
        }
    };
</script>
</body>
</html>
